services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stroke_twin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stroke_twin_data:/var/lib/postgresql/data

volumes:
  stroke_twin_data: